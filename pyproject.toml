[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aivcs"
version = "0.1.0"
description = "A small, educational AI-native version control core"
requires-python = ">=3.10"

[project.scripts]
aivcs = "aivcs.cli:main"

[tool.setuptools.packages.find]
include = ["aivcs*"]
